<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Advanced Health Assistant with Doctor Recommendations" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <title>Health Assistant</title>
  <script>
    // Check if user is coming from landing page or is authenticated
    const fromLanding = sessionStorage.getItem('fromLanding');
    const isAuthenticated = localStorage.getItem('user_data') || localStorage.getItem('doctor_data');
    
    // If not from landing and not authenticated, redirect to landing page
    if (!fromLanding && !isAuthenticated && window.location.pathname.endsWith('/')) {
      window.location.href = './landing.html';
    }
  </script>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
